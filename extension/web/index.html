<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Talk2View — MVP</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f7f8;
    color: #111;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  p  { margin: 0 0 8px; font-size: 13px; color: #555; }
  button {
    background: #111; color: #fff; border: 0; padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  pre {
    background: #fff; border: 1px solid #ddd; border-radius: 4px;
    padding: 8px; font-size: 12px; margin-top: 12px; max-height: 200px;
    overflow: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>
<h1>Talk2View — MVP sentinel</h1>
<p>
  This is the pywebview-from-LibreOffice proof of concept (ADR-0030).
  If you can see this page, the bundle pipeline works.
</p>
<p>The React + Talk2View SDK + writerTools come next.</p>
<button id="ping">Send ping to Python →</button>
<pre id="log">Loaded at: <span id="loaded"></span>
User-agent: <span id="ua"></span>
</pre>
<script>
  document.getElementById('loaded').textContent = new Date().toISOString();
  document.getElementById('ua').textContent = navigator.userAgent;
  const logEl = document.getElementById('log');
  function append(line) {
    logEl.textContent += '\n' + line;
  }
  document.getElementById('ping').addEventListener('click', async () => {
    append('[' + new Date().toISOString() + '] ping clicked — calling pywebview.api.ping()');
    try {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.ping) {
        const result = await window.pywebview.api.ping('hello from JS');
        append('  ← Python returned: ' + JSON.stringify(result));
      } else {
        append('  (no pywebview.api.ping bridge wired in this MVP sentinel — expected)');
      }
    } catch (e) {
      append('  EXCEPTION: ' + e);
    }
  });
</script>
</body>
</html>
