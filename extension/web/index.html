<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Talk2View — bridge test</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f7f8;
    color: #111;
    font-size: 13px;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.lead { margin: 0 0 12px; font-size: 12px; color: #666; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  button {
    background: #111; color: #fff; border: 0; padding: 6px 10px;
    border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #333; }
  button.alt { background: #555; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 6px 8px; font-size: 12px;
    border: 1px solid #ccc; border-radius: 4px;
  }
  pre {
    background: #fff; border: 1px solid #ddd; border-radius: 4px;
    padding: 8px; font-size: 11px; margin: 8px 0; max-height: 380px;
    overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  .err { color: #c00; }
</style>
</head>
<body>
<h1>Talk2View — bridge MVP</h1>
<p class="lead">
  ADR-0030 step 2: JS ↔ Python bridge over Unix socket. React + Talk2View
  SDK come next; this page is the smoke test for the tool transport.
</p>

<div class="row">
  <button onclick="callPing()">Ping (no bridge)</button>
  <button class="alt" onclick="callListTools()">list_tools</button>
</div>

<div class="row">
  <button onclick="callTool('get_selection', {})">get_selection</button>
  <button onclick="callTool('get_document', {start_index: 0, count: 10})">get_document(0, 10)</button>
</div>

<div class="row">
  <input id="search-q" type="text" placeholder="search query"/>
  <button onclick="callTool('search_document', {query: document.getElementById('search-q').value, action: 'find'})">search_document</button>
</div>

<div class="row">
  <input id="insert-text" type="text" placeholder="text to insert at end"/>
  <button onclick="callTool('insert_content', {text: document.getElementById('insert-text').value, location: 'end'})">insert_content</button>
</div>

<div class="row">
  <input id="format-q" type="text" placeholder="text to bold"/>
  <button onclick="callTool('format_text', {query: document.getElementById('format-q').value, bold: true})">format_text bold</button>
</div>

<pre id="output">Click a button to test the bridge.</pre>

<script>
  const out = document.getElementById('output');
  function append(prefix, payload) {
    const ts = new Date().toISOString().slice(11, 23);
    out.textContent += '\n[' + ts + '] ' + prefix + ' ' +
      (typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2));
    out.scrollTop = out.scrollHeight;
  }

  async function callPing() {
    try {
      const r = await window.pywebview.api.ping('hello from JS at ' + new Date().toISOString());
      append('ping →', r);
    } catch (e) {
      append('ping !!', String(e));
    }
  }

  async function callListTools() {
    try {
      const r = await window.pywebview.api.list_tools();
      append('list_tools →', r);
    } catch (e) {
      append('list_tools !!', String(e));
    }
  }

  async function callTool(name, args) {
    append(name + '(' + JSON.stringify(args) + ') …', '');
    try {
      const r = await window.pywebview.api.invoke_tool(name, args);
      append(name + ' →', r);
    } catch (e) {
      append(name + ' !!', String(e));
    }
  }
</script>
</body>
</html>
