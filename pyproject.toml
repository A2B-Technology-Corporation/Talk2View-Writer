[project]
name = "talk2view-writer"
version = "1.0.0"
description = "Talk2View AI document assistant for LibreOffice Writer"
authors = [
    { name = "A2B Technology Corporation Pty Ltd", email = "support@talk2view.com" }
]
readme = "README.md"
license = { text = "MPL-2.0" }
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["libreoffice", "writer", "ai", "copilot", "talk2view"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Office Suites",
    "Typing :: Typed",
]

dependencies = [
    "talk2view",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pywebview>=6.2.1",
]

[tool.uv.sources]
talk2view = { path = "../Talk2View-Platform/packages/sdk-python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.0",
]

# Dependencies needed only when running the GUI smoke test against a
# real LibreOffice instance. Linux-only because dogtail wraps AT-SPI
# which only exists on Linux/Wayland desktops. Installed on demand
# by the CI workflow (Linux job): `uv sync --group gui-smoke`.
gui-smoke = [
    "dogtail; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://talk2view.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk2view_writer"]

[tool.ruff]
# Matches the talk2view Python SDK (Talk2View-Platform/packages/sdk-python).
# Tool code uses long Word-faithful error / recovery strings that read
# poorly when wrapped under 88. SpeedWriter uses 88, but its problem
# domain (voice transcription) doesn't have the same string-heavy
# bodies.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
# Tests don't need exhaustive docstrings — the function name is the
# spec. Mocked UNO callback signatures are fine to keep camelCase to
# mirror the real interface they replace. D105 covers magic methods
# in synthetic UNO classes (``__getattr__`` etc.) — their behaviour
# is documented in the surrounding class docstring.
"tests/**" = ["D101", "D102", "D103", "D105", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["talk2view_writer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `--timeout=60` is a global per-test ceiling — any test that hangs
# beyond 60s gets killed by pytest-timeout with a Python traceback
# instead of an opaque "runner shutdown signal". Without this, a
# hung soffice/UNO call on a CI runner kills the whole job and leaves
# no diagnostic trail. See investigation #27.
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--timeout=60",
    "--timeout-method=thread",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Requires headless soffice on 127.0.0.1:2002 (cross-platform)",
    "synthetic: Exercises real tool bodies against an in-process synthetic UNO Writer document (no soffice required).",
    "gui_smoke: Linux-only AT-SPI sidebar test (dogtail). Required-pass.",
    "live: Live chat E2E against engine.talk2view.com. Requires T2V_TEST_USER_EMAIL/PASSWORD env.",
    "e2e: End-to-end tests (legacy alias; superseded by integration + gui_smoke + live)",
    "release_smoke: Validates a packaged/published .oxt artifact. Requires T2V_RELEASE_OXT env pointing at the .oxt; no soffice needed.",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["uno.*", "unohelper.*", "com.sun.star.*", "talk2view.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
