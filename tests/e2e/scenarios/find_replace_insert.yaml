name: find-replace-insert
description: >
  Exercises insert_content with target_query (find-and-replace
  insertion) — one of the documented "do it in one call" patterns
  from SYSTEM_PROMPT.md. Two steps: insert a template paragraph,
  then replace the [TOKEN] placeholder with real content.

steps:
  - prompt: >
      Insert this paragraph: "Dear [NAME], thank you for your message
      dated [DATE]. We will respond within five business days."
    expect:
      assistant_contains:
        - inserted
        - added
        - paragraph
      doc:
        min_paragraphs: 1
        any_text_contains:
          - "[NAME]"
          - "[DATE]"
      tool_calls:
        must_invoke:
          - insert_content
        max_count: 2
        no_duplicate_with: insert_content

  - prompt: >
      Replace "[NAME]" with "Jordan" and "[DATE]" with "May 25".
    expect:
      assistant_contains:
        - replac
        - jordan
        - may
      doc:
        any_text_contains:
          - jordan
          - may 25
        # Placeholders should be gone after replacement.
        # (We don't have a negative-contains assertion, but the
        # any_text_contains above proves the replacements landed.)
      tool_calls:
        # Two substitutions = 2 search_document calls in the happy path.
        # But the engine emits non-deterministic duplicates (temperature
        # 1.0 — Platform #64 / Investigation #40 / #43). Observed counts:
        # CI 26393304779 = 4 (1 get_document + 2 search + 1 dup);
        # CI 26464990610 = 5 (get_document + 2× search[DATE] dup +
        # re-read get_document + search[NAME]). The replacements still
        # land correctly either way (any_text_contains above verifies
        # the outcome). Cap at 6 to absorb the engine's duplicate/re-read
        # variance. Tighten back to 3 once Platform #64 lands (temp drop
        # → deterministic single calls).
        must_invoke:
          - search_document
        max_count: 6
