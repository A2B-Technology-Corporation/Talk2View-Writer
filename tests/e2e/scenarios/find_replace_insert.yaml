name: find-replace-insert
description: >
  Exercises insert_content with target_query (find-and-replace
  insertion) — one of the documented "do it in one call" patterns
  from SYSTEM_PROMPT.md. Two steps: insert a template paragraph,
  then replace the [TOKEN] placeholder with real content.

steps:
  - prompt: >
      Insert this paragraph: "Dear [NAME], thank you for your message
      dated [DATE]. We will respond within five business days."
    expect:
      assistant_contains:
        - inserted
        - added
        - paragraph
      doc:
        min_paragraphs: 1
        any_text_contains:
          - "[NAME]"
          - "[DATE]"
      tool_calls:
        must_invoke:
          - insert_content
        max_count: 2
        no_duplicate_with: insert_content

  - prompt: >
      Replace "[NAME]" with "Jordan" and "[DATE]" with "May 25".
    expect:
      assistant_contains:
        - replac
        - jordan
        - may
      doc:
        any_text_contains:
          - jordan
          - may 25
        # Placeholders should be gone after replacement.
        # (We don't have a negative-contains assertion, but the
        # any_text_contains above proves the replacements landed.)
      tool_calls:
        # Two substitutions = 2 search_document calls. Observed in
        # CI 26393304779: the engine emitted a duplicate
        # search_document([NAME]→Jordan) call before moving to the
        # [DATE] substitution — same engine non-determinism class as
        # Investigation #40 (page_setup duplicates). 1 get_document
        # + 2 search_document + 1 duplicate = 4 calls. Cap at 4 with
        # this explainer; if the engine stops emitting duplicates
        # we can tighten back to 3.
        must_invoke:
          - search_document
        max_count: 4
