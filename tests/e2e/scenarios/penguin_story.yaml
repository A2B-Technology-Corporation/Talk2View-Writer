name: penguin-story
description: >
  A scripted user session that exercises the chat-driven document
  creation + formatting + extension workflow. Expectations are tight
  — every assertion either reflects observed behaviour from green
  runs or encodes an invariant we want to enforce (no tool-call
  loops, correct heading style, etc.). Any soft-failure fails the
  test so regressions surface immediately. Loosen only with a
  documented reason.

# Per-step shape:
#
#   prompt:                user text typed into the composer
#   expect:
#     assistant_contains:  substrings the assistant reply must
#                          contain (case-insensitive). At least one
#                          must match.
#     doc:
#       exact_paragraphs:  exact total paragraph count after the
#                          step. Use min/max_paragraphs only when
#                          legitimate LLM variance applies.
#       min_paragraphs:    inclusive lower bound (alt. to exact).
#       max_paragraphs:    inclusive upper bound.
#       any_text_contains: substrings that must appear somewhere
#                          in the doc body (case-insensitive).
#       paragraph_style_at:
#         - {index: N, style_in: ["Heading1", "Title"]}
#                          paragraph N's style must be in the list
#                          (lets us tolerate Title vs Heading1).
#       paragraph_text_contains_at:
#         - {index: N, contains: "…"}
#                          paragraph N's text must contain the
#                          substring (case-insensitive).
#     tool_calls:
#       must_invoke:       list of tool names the engine must call
#                          (any order, any count >= 1).
#       max_count:         total tool-call upper bound per step.
#                          Catches Platform #62 loops.
#       no_duplicate_with: tool name that must not be called twice
#                          with identical args. Catches the exact
#                          symptom of Platform #62.

steps:
  - prompt: >
      Write a short story about penguins in Antarctica titled
      "The Frosty March". Use a Title style for the title and
      split the body into three Normal paragraphs.
    expect:
      assistant_contains:
        - penguin
        - story
        - antarctica
        - frosty
        - title
      doc:
        exact_paragraphs: 4
        any_text_contains:
          - penguin
        paragraph_style_at:
          # Title style on paragraph 0 (model may emit Title or
          # Heading1 — both render as a title). Body paragraphs read back
          # as "Normal": Word "Normal" now maps to the named "Text body"
          # (investigation #53/#56), and get_document folds "Text body"
          # back through libreoffice_to_word_style -> "Normal" (reading.py).
          # "Standard"/"Text body" are kept for older builds / explicit
          # "Default Paragraph Style". All are valid body styles in LO.
          - { index: 0, style_in: ["Title", "Heading1"] }
          - { index: 1, style_in: ["Normal", "Standard", "Text body"] }
          - { index: 2, style_in: ["Normal", "Standard", "Text body"] }
          - { index: 3, style_in: ["Normal", "Standard", "Text body"] }
        paragraph_text_contains_at:
          - { index: 0, contains: "frosty march" }
      tool_calls:
        # With the insert_content top-level-style fix (commit 9e04ebc)
        # the model now does this in 3 calls: get_document +
        # insert_content(Title) + insert_content(body). Cap at 4 for
        # headroom; the duplicate guard catches Platform #62 loops.
        must_invoke:
          - insert_content
        max_count: 4
        no_duplicate_with: insert_content

  - prompt: format the title as Heading 1 and centre it
    expect:
      assistant_contains:
        - heading
        - title
        - format
        - center
      doc:
        exact_paragraphs: 4
        paragraph_style_at:
          # Title is now Heading1 (the canonical LO style name).
          - { index: 0, style_in: ["Heading1", "Heading 1"] }
      tool_calls:
        must_invoke:
          - format_paragraph
        # Observed-stable: 3 calls (get_document + 2× format_paragraph
        # for style + alignment). Cap at 4.
        max_count: 4
        no_duplicate_with: format_paragraph

  - prompt: add a one-paragraph conclusion at the end of the story
    expect:
      assistant_contains:
        - add
        - conclusion
        - paragraph
        - end
      doc:
        exact_paragraphs: 5
        paragraph_style_at:
          - { index: 4, style_in: ["Normal", "Standard", "Text body"] }
      tool_calls:
        must_invoke:
          - insert_content
        # Observed-stable: 1 call (insert_content with location=end).
        max_count: 2
        no_duplicate_with: insert_content
