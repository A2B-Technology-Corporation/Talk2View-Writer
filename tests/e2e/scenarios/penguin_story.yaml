name: penguin-story
description: >
  A scripted user session that exercises the chat-driven document
  creation + formatting workflow. Each step lists the user prompt
  and what we expect to see afterwards. Assertions are intentionally
  loose because LLM output varies — we fail only on obvious model
  misbehaviour (errors, infinite tool loops, completely-unchanged
  doc when the prompt should have edited). Full transcript per step
  is captured as an artifact so Claude / a reviewer can read what
  actually happened and tighten the expectations as patterns emerge.

# Per-step shape:
#
#   prompt:                user text typed into the composer
#   expect:
#     assistant_contains:  list of substrings the assistant reply
#                          must contain (case-insensitive); loose.
#     doc:
#       min_paragraphs:    minimum total paragraph count after the
#                          step (loose — model may produce more or
#                          fewer paragraphs).
#       max_paragraphs:    maximum (optional — set when the prompt
#                          should NOT keep growing the doc).
#       any_text_contains: list of substrings that must appear
#                          somewhere in the doc body (case-insens).
#     tool_calls:
#       must_invoke:       list of tool names the engine should call
#                          (any order). E.g. ["insert_content"].
#       max_count:         total tool calls upper bound — catches
#                          loops like Platform #62.
#       no_duplicate_with: tool name that must not be repeated with
#                          identical args (catches Platform #62
#                          symptom directly).

steps:
  - prompt: |
      Write a short story about penguins in Antarctica. Title it
      and split into paragraphs.
    expect:
      assistant_contains:
        - penguin
      doc:
        min_paragraphs: 3
        any_text_contains:
          - penguin
      tool_calls:
        must_invoke:
          - insert_content
        max_count: 5

  - prompt: format the title as Heading 1 and centre it
    expect:
      assistant_contains:
        - format
      doc:
        # Same paragraph count — formatting doesn't add paragraphs.
        min_paragraphs: 3
      tool_calls:
        must_invoke:
          - format_paragraph
        max_count: 4
        no_duplicate_with: format_paragraph

  - prompt: add a one-paragraph conclusion at the end of the story
    expect:
      assistant_contains:
        - conclusion
      doc:
        min_paragraphs: 4
      tool_calls:
        must_invoke:
          - insert_content
        max_count: 4
