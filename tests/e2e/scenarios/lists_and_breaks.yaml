name: lists-and-breaks
description: >
  Exercises manage_list (bulleted lists) + insert_break (page break).
  Three steps: insert 3 items, convert to bullets, insert page break.

steps:
  - prompt: >
      Insert three short paragraphs: "Apples", "Bananas", "Cherries".
    expect:
      assistant_contains:
        - apple
        - banan
        - cherr
      doc:
        # Three new paragraphs at minimum.
        min_paragraphs: 3
        any_text_contains:
          - apples
          - bananas
          - cherries
        paragraph_text_contains_at:
          # Exact ordering not guaranteed across paragraphs, but
          # the doc must contain all three terms (covered by
          # any_text_contains above).
          []
      tool_calls:
        must_invoke:
          - insert_content
        # Observed-stable: 1 call (3 blocks in one insert_content).
        max_count: 2
        no_duplicate_with: insert_content

  - prompt: >
      Convert those three fruit paragraphs into a bulleted list.
    expect:
      assistant_contains:
        - bullet
        - list
      doc:
        # Same paragraph count — bulleting changes paragraph style,
        # doesn't add/remove paragraphs.
        min_paragraphs: 3
      tool_calls:
        # Don't pin must_invoke: model sometimes calls manage_list,
        # sometimes format_paragraph(style="ListBullet") + search_document.
        # Both produce a bulleted list. The outcome assertion is what
        # matters; tool path is a model choice. Observed-stable: 6
        # calls (1 get_document + 2 manage_list + 3 search_document
        # — the search_document calls add bullet glyphs when manage_list
        # doesn't take). Cap at 8 for headroom.
        max_count: 8

  - prompt: insert a page break at the end of the document
    expect:
      assistant_contains:
        - page break
        - inserted
        - added
      doc:
        # Page break adds either a paragraph or a paragraph-level
        # break property; either way total_paragraphs may bump by 1.
        min_paragraphs: 3
      tool_calls:
        # Model may use insert_break OR insert_content +
        # format_paragraph(page_break_before=true). Observed-stable:
        # 1 call (insert_break).
        max_count: 3
