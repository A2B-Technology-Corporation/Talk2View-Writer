name: undo-delete
description: >
  Exercises undo_redo + delete_content. Insert two paragraphs, delete
  the second, then undo to restore it.

steps:
  - prompt: >
      Insert exactly two paragraphs: "First paragraph." and "Second
      paragraph."
    expect:
      assistant_contains:
        - paragraph
        - inserted
      doc:
        min_paragraphs: 2
        any_text_contains:
          - first paragraph
          - second paragraph
      tool_calls:
        must_invoke:
          - insert_content
        # Observed-stable: 1 call (both paragraphs in one insert_content).
        max_count: 2
        no_duplicate_with: insert_content

  - prompt: delete the second paragraph
    expect:
      assistant_contains:
        - delet
        - second
        - removed
      doc:
        # Outcome: doc no longer contains "second paragraph".
        min_paragraphs: 1
        any_text_contains:
          - first paragraph
      tool_calls:
        # Model may use delete_content OR
        # search_document(replace_with="") — both achieve the delete.
        # Observed-stable: 2 calls (get_document + delete_content).
        max_count: 3

  - prompt: undo that deletion
    expect:
      assistant_contains:
        - undone
        - restored
        - undo
        - added
        - second
      doc:
        # Outcome: "second paragraph" is back in the doc — either
        # via undo_redo (proper undo) or via re-insertion.
        any_text_contains:
          - second paragraph
      tool_calls:
        # Model sometimes uses undo_redo, sometimes re-inserts via
        # insert_content. Both achieve the doc outcome.
        # Observed-stable: 1 call (undo_redo).
        max_count: 2
