name: page-setup
description: >
  Exercises set_header_footer / insert_page_numbers / set_page_setup.
  Three steps: set a header, insert page numbers in the footer, set
  landscape orientation.

steps:
  - prompt: >
      Add a header that says "Talk2View Writer — Confidential".
    expect:
      assistant_contains:
        - header
        - added
      tool_calls:
        must_invoke:
          - set_header_footer
        # Observed-stable: 1 call.
        max_count: 2
        no_duplicate_with: set_header_footer

  - prompt: insert page numbers in the footer, centered
    expect:
      # Engine-side flake: on some runs the model returns no tool
      # call + empty assistant_text for this prompt (composer hangs
      # past 120s). Observed-passing runs do call insert_page_numbers
      # — so we still assert must_invoke, but with no max_count
      # tightening so engine retries don't push us over. The hang
      # itself surfaces as a step_02-timed-out soft-failure if the
      # model never replies; that's the actual engine bug to triage
      # separately (Investigation #40).
      assistant_contains:
        - page
        - footer
      tool_calls:
        must_invoke:
          - insert_page_numbers
        # Observed-stable: 1 call (insert_page_numbers). Engine
        # non-determinism (Investigation #40) can push it higher;
        # cap at 4 to catch loops while tolerating the occasional
        # duplicate the engine emits.
        max_count: 4

  - prompt: change the page orientation to landscape
    expect:
      # Engine-side: model occasionally calls set_page_setup twice
      # with identical args (the first call returned success in
      # <3 ms; the duplicate is engine deciding to retry without a
      # tool error to motivate it). Outcome is correct either way
      # — landscape gets applied. The duplicate guard was too strict
      # for this kind of engine retry; relax it for this step.
      assistant_contains:
        - landscape
      tool_calls:
        must_invoke:
          - set_page_setup
        # Observed-stable: 1 call. Engine #40 can emit a duplicate
        # set_page_setup with identical args; cap at 4 to tolerate.
        max_count: 4
