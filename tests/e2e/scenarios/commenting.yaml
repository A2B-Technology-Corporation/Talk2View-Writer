name: commenting
description: >
  Exercises get_comments / add_comment / manage_comment. Two steps:
  insert seed content, anchor a comment to a phrase, then list/get
  the comments to confirm.

steps:
  - prompt: >
      Insert a single paragraph that says: "The fox jumped over the
      lazy dog."
    expect:
      assistant_contains:
        # Either "fox" (the inserted phrase) or any natural-language
        # confirmation that the paragraph was inserted. Observed
        # variants: "inserted the paragraph", "added the paragraph",
        # "written the sentence". Doc assertion below is what
        # actually verifies the content; this just guards against
        # the engine returning empty / off-topic text.
        - fox
        - inserted
        - added
        - paragraph
      doc:
        any_text_contains:
          - fox
      tool_calls:
        must_invoke:
          - insert_content
        # Observed-stable: 1 call.
        max_count: 2
        no_duplicate_with: insert_content

  - prompt: >
      Add a Word-style review comment anchored to the word "lazy"
      with the text "Reviewer: is this word fair?". Use the
      add_comment tool — this should appear in the Comments
      sidebar, not in the document body.
    expect:
      assistant_contains:
        - comment
      tool_calls:
        # With the LO #38 fallback in place, the model now succeeds
        # earlier: 1 add_comment that errors with structured recovery,
        # 1 get_document to find a different anchor, 1 add_comment
        # that succeeds = 3 calls observed in CI 26389412920. Cap at
        # 5 for headroom on natural-language variance (model may
        # also call get_comments to verify).
        max_count: 5
