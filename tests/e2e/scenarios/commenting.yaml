name: commenting
description: >
  Exercises get_comments / add_comment / manage_comment. Two steps:
  insert seed content, anchor a comment to a phrase, then list/get
  the comments to confirm.

steps:
  - prompt: >
      Insert a single paragraph that says: "The fox jumped over the
      lazy dog."
    expect:
      assistant_contains:
        - fox
        - inserted
      doc:
        any_text_contains:
          - fox
      tool_calls:
        must_invoke:
          - insert_content
        max_count: 3
        no_duplicate_with: insert_content

  - prompt: >
      Add a Word-style review comment anchored to the word "lazy"
      with the text "Reviewer: is this word fair?". Use the
      add_comment tool — this should appear in the Comments
      sidebar, not in the document body.
    expect:
      assistant_contains:
        - comment
      tool_calls:
        # add_comment hits the LO SwTextAttr bug (Investigation #38)
        # on this build for several anchors. The model retries with
        # different anchors and adds padding text; observed-stable
        # call counts: 1 get_document + 3 add_comment retries + 2
        # insert_content padding attempts = 6. Bump to 7 for headroom.
        # Stretch target: once the LO bug fixes upstream, the model
        # should succeed in 1-2 calls — tighten then.
        max_count: 7
