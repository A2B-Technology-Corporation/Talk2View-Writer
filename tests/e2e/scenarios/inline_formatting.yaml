name: inline-formatting
description: >
  Exercises format_text (inline character formatting). Two steps:
  insert a sentence, then bold a specific word. Verifies the formatting
  was applied via doc state assertions (font weight on the matching
  text run).

steps:
  - prompt: >
      Insert this exact sentence: "The quick brown fox jumps over the lazy dog."
    expect:
      assistant_contains:
        - inserted
        - added
        - paragraph
      doc:
        min_paragraphs: 1
        any_text_contains:
          - quick brown fox
      tool_calls:
        must_invoke:
          - insert_content
        # Observed-stable: 1 call.
        max_count: 2
        no_duplicate_with: insert_content

  - prompt: make the word "brown" bold
    expect:
      assistant_contains:
        - bold
        - brown
      doc:
        # The sentence stays intact; only formatting changes.
        any_text_contains:
          - quick brown fox
      tool_calls:
        must_invoke:
          - format_text
        # Observed-stable: 1 call (format_text with query="brown",
        # bold=true). Model may call get_document first; cap at 3.
        max_count: 3
        no_duplicate_with: format_text
